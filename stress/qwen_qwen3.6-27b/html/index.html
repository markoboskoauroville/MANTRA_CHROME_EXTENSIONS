<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dark Page</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background-color: #1a1a2e;
      color: #e0e0e0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    h1 {
      color: #7ec8e3;
      margin-bottom: 1rem;
    }
    p {
      max-width: 40em;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 600px;
    }
    th, td {
      text-align: left;
      padding: 0.6rem 1rem;
      border: 1px solid #333;
    }
    th {
      background-color: #16213e;
      color: #a8dadc;
    }
    tr:nth-child(even) {
      background-color: #0f3460;
    }
  </style>
</head>
<body>
  <h1>Dark Page</h1>
  <p>This is a simple dark-themed page built with valid HTML5. It contains a heading, a paragraph, and a small table below. No JavaScript is used; all styling lives in the inline style block above.</p>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Value</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>Alpha</td>
        <td>10</td>
      </tr>
      <tr>
        <td>2</td>
        <td>Beta</td>
        <td>20</td>
      </tr>
      <tr>
        <td>3</td>
        <td>Gamma</td>
        <td>30</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
