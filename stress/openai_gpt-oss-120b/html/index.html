<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dark Page Example</title>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: Arial, Helvetica, sans-serif;
      margin: 2rem;
    }
    h1 {
      color: #ffffff;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 600px;
      margin-top: 1rem;
    }
    th, td {
      border: 1px solid #444;
      padding: 0.5rem 1rem;
      text-align: left;
    }
    th {
      background-color: #1e1e1e;
    }
    tr:nth-child(even) td {
      background-color: #1a1a1a;
    }
  </style>
</head>
<body>
  <h1>Welcome to the Dark Page</h1>
  <p>This is a simple dark-themed page with a heading, a paragraph, and a table.</p>
  <table>
    <thead>
      <tr>
        <th>Item</th>
        <th>Description</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Row 1</td>
        <td>First row description</td>
      </tr>
      <tr>
        <td>Row 2</td>
        <td>Second row description</td>
      </tr>
      <tr>
        <td>Row 3</td>
        <td>Third row description</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
